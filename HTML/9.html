
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Varad & Madhura - English Conversation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #a1c4fd, #fbc2eb);
}

.scene {
    width: 100%;
    max-width: 750px;
    padding: 25px;
    background: white;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px #5553;
}

h1 {
    color: #6651c8;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

.characters {
    display: flex;
    justify-content: space-around;
    gap: 15px;
}

.character {
    width: 50%;
    padding: 15px;
    border-radius: 20px;
    transition: 0.3s;
}

.varad {
    background: #e3f2fd;
}

.madhura {
    background: #fce4ec;
}

.avatar {
    display: inline-block;
    font-size: 85px;
    animation: float 2s infinite ease-in-out;
}

.character.talking .avatar {
    animation: talk 0.3s infinite alternate;
}

.name {
    font-size: 22px;
    font-weight: bold;
    margin: 10px 0;
}

.varad .name {
    color: #1976d2;
}

.madhura .name {
    color: #d81b60;
}

.bubble {
    min-height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    background: white;
    border-radius: 15px;
    line-height: 1.5;
    font-size: 15px;
}

.status {
    margin: 20px 0;
    color: #555;
    font-weight: bold;
}

button {
    margin: 5px;
    padding: 12px 20px;
    border: none;
    border-radius: 25px;
    color: white;
    background: #6651c8;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #4937a5;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

@keyframes talk {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-5px) scale(1.08); }
}

@media (max-width: 480px) {
    .scene { padding: 15px; }
    .avatar { font-size: 60px; }
    .character { padding: 8px; }
    .bubble { font-size: 13px; padding: 10px; }
}
</style>
</head>

<body>

<div class="scene">

    <h1>💕 Varad & Madhura 💕</h1>
    <p class="subtitle">A Cute English Conversation</p>

    <div class="characters">

        <div class="character varad" id="varad">
            <div class="avatar">👦🏻</div>
            <div class="name">Varad</div>
            <div class="bubble" id="varadText">
                Hi Madhura! How are you?
            </div>
        </div>

        <div class="character madhura" id="madhura">
            <div class="avatar">👧🏻</div>
            <div class="name">Madhura</div>
            <div class="bubble" id="madhuraText">
                Hello Varad! I am fine.
            </div>
        </div>

    </div>

    <p class="status" id="status">
        Click Start to begin!
    </p>

    <button onclick="startConversation()">▶ Start Talking</button>
    <button onclick="pauseConversation()">⏸ Pause / Resume</button>
    <button onclick="replayConversation()">↻ Replay</button>

</div>

<script>
const conversation = [
    {
        speaker: "varad",
        text: "Hi Madhura! How are you today?"
    },
    {
        speaker: "madhura",
        text: "Hello Varad! I am fine. How are you?"
    },
    {
        speaker: "varad",
        text: "I am great! What are you doing?"
    },
    {
        speaker: "madhura",
        text: "I am learning English. I want to speak fluently."
    },
    {
        speaker: "varad",
        text: "That is wonderful! English is easy when we practice."
    },
    {
        speaker: "madhura",
        text: "You are right! Can we practice together?"
    },
    {
        speaker: "varad",
        text: "Of course! What is your favorite hobby?"
    },
    {
        speaker: "madhura",
        text: "I love listening to music and learning new things."
    },
    {
        speaker: "varad",
        text: "That sounds nice! Never stop learning."
    },
    {
        speaker: "madhura",
        text: "Thank you, Varad. You are a good friend!"
    },
    {
        speaker: "varad",
        text: "You are welcome, Madhura. See you tomorrow!"
    },
    {
        speaker: "madhura",
        text: "Goodbye, Varad! Have a wonderful day!"
    }
];

let index = 0;
let timer = null;
let paused = false;
let running = false;
let session = 0;

function showLine(currentSession) {
    if (currentSession !== session || paused || !running) return;

    if (index >= conversation.length) {
        running = false;
        timer = null;

        document.getElementById("status").textContent =
            "🎉 Conversation completed! Great job!";

        document.getElementById("varad").classList.remove("talking");
        document.getElementById("madhura").classList.remove("talking");
        return;
    }

    const line = conversation[index];

    document.getElementById("varad").classList.remove("talking");
    document.getElementById("madhura").classList.remove("talking");

    document.getElementById(line.speaker).classList.add("talking");

    document.getElementById(line.speaker + "Text").textContent =
        line.text;

    document.getElementById("status").textContent =
        (line.speaker === "varad" ? "🔵 Varad is speaking..." :
        "💗 Madhura is speaking...");

    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();

        const voice = new SpeechSynthesisUtterance(line.text);
        voice.lang = "en-US";
        voice.rate = 0.85;
        voice.pitch = line.speaker === "varad" ? 0.9 : 1.15;

        voice.onend = function() {
            if (currentSession !== session || paused || !running) return;

            timer = setTimeout(function() {
                index++;
                showLine(currentSession);
            }, 500);
        };

        voice.onerror = function() {
            if (currentSession !== session || paused || !running) return;

            timer = setTimeout(function() {
                index++;
                showLine(currentSession);
            }, 1500);
        };

        speechSynthesis.speak(voice);
    } else {
        timer = setTimeout(function() {
            index++;
            showLine(currentSession);
        }, 3000);
    }
}

function startConversation() {
    if (running && !paused) return;

    if (paused) {
        paused = false;
        running = true;

        if ("speechSynthesis" in window) {
            speechSynthesis.resume();
        }

        showLine(session);
        return;
    }

    running = true;
    paused = false;
    showLine(session);
}

function pauseConversation() {
    if (!running && !paused) return;

    if (!paused) {
        paused = true;
        clearTimeout(timer);
        timer = null;

        if ("speechSynthesis" in window) {
            speechSynthesis.pause();
        }

        document.getElementById("status").textContent =
            "⏸ Conversation paused. Click Resume to continue.";
    } else {
        paused = false;

        if ("speechSynthesis" in window) {
            speechSynthesis.resume();
        }

        showLine(session);
    }
}

function replayConversation() {
    session++;
    clearTimeout(timer);
    timer = null;

    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
    }

    index = 0;
    paused = false;
    running = true;

    document.getElementById("varadText").textContent =
        "Hi Madhura! How are you?";
    document.getElementById("madhuraText").textContent =
        "Hello Varad! I am fine!";

    showLine(session);
}
</script>

</body>
</html>
