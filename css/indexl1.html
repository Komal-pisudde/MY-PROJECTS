<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Level 1 Practice</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="stylel1.css">

    <!-- Internal CSS -->
    <style>
        h2{
            color: blue;
        }
    </style>
</head>
<body>

    <!-- Inline CSS -->
    <h1 style="color: pink;">Welcome to CSS</h1>

    <h2>Internal CSS Example</h2>

    <h3 class="heading">Heading 3</h3>

    <h4 class="heading">Heading 4</h4>

    <div id="box">
        This is a div with ID "box".
    </div>

    <br>

    <button>Click Me</button>

</body>
</html>
