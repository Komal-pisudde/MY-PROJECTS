<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Boxes</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 23px;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 45px;
            width: 45px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <!-- Given 5 boxes, Assign a random color and a random background to each box using DOM concepts -->

    <div class="container">
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
    </div>

    <script>

        // Select all boxes
        let boxes = document.getElementsByClassName("box");

        // Function to generate random color
        function getRandomColor() {
            let r = Math.floor(Math.random() * 256);
            let g = Math.floor(Math.random() * 256);
            let b = Math.floor(Math.random() * 256);

            return `rgb(${r}, ${g}, ${b})`;
        }

        // Apply random colors to every box
        for (let i = 0; i < boxes.length; i++) {

            boxes[i].style.color = getRandomColor();

            boxes[i].style.backgroundColor = getRandomColor();
        }

    </script>

</body>
</html>
